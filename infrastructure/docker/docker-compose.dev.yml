name: claudemaison-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: cm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claudemaison}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claudemaison}
      POSTGRES_DB: ${POSTGRES_DB:-claudemaison}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schéma déclaratif appliqué au premier démarrage (volume vide).
      # En prod, ce sont les migrations Atlas qui font foi — ce mount est
      # une commodité de dev pour avoir une base prête à l'usage sans
      # commande supplémentaire.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claudemaison} -d ${POSTGRES_DB:-claudemaison}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cm-qdrant
    restart: unless-stopped
    profiles: ["ai", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    container_name: cm-nats
    restart: unless-stopped
    profiles: ["ai", "full"]
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: cm-minio
    restart: unless-stopped
    profiles: ["ai", "full"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Provider OIDC pour l'étape 3 du module auth.
  # Opt-in via `--profile oidc` : Keycloak coûte ~500 Mo RAM et ~20s au boot,
  # inutile pour les développeurs qui ne touchent pas au flux OIDC.
  # Le realm `claudemaison-dev` est importé au premier démarrage avec le client
  # `edge-api` (PKCE S256) et deux users seedés (alice/bob).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cm-keycloak
    restart: unless-stopped
    profiles: ["oidc", "full"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-claudemaison-dev.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 expose /health/ready sur le port management 9000, mais ce
      # port n'est pas activé en start-dev. On vérifie donc l'endpoint OIDC
      # discovery sur 8080 (présent dès que le realm est importé).
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/claudemaison-dev/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'issuer' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  nats-data:
  minio-data:
  keycloak-data:
