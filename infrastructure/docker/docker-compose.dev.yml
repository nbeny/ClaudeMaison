name: claudemaison-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: cm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claudemaison}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claudemaison}
      POSTGRES_DB: ${POSTGRES_DB:-claudemaison}
    ports:
      - "5432:5432"
    # Attention : les scripts `docker-entrypoint-initdb.d/*` ci-dessous ne
    # s'exécutent QUE sur un volume vide. Si tu mets à jour depuis une env
    # antérieure qui a déjà un `postgres-data`, citext/pgcrypto ne seront pas
    # provisionnés. Solutions : `docker compose -f infrastructure/docker/docker-compose.dev.yml down -v`
    # pour repartir à zéro, OU appliquer les migrations Atlas manuellement, OU
    # à la rache `psql -c "CREATE EXTENSION IF NOT EXISTS citext"` (idem pgcrypto).
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Extensions Postgres chargées avant le schéma applicatif :
      # Atlas CE ne gère pas CREATE EXTENSION dans son diff, donc on
      # provisionne citext/pgcrypto via initdb pour que le schema.sql
      # (et les migrations Atlas en prod) puissent s'y appuyer.
      - ../db/init/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      # Schéma déclaratif appliqué au premier démarrage (volume vide).
      # En prod, ce sont les migrations Atlas qui font foi — ce mount est
      # une commodité de dev pour avoir une base prête à l'usage sans
      # commande supplémentaire.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      # Seed dev-only : alice/bob, federated_identities Keycloak (UUIDs
      # alignés sur realm-claudemaison-dev.json), workspace de démo.
      # Indispensable au smoke E2E (cf. scripts/smoke-chat.sh).
      - ../db/init/20-dev-seed.sql:/docker-entrypoint-initdb.d/20-dev-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-claudemaison} -d ${POSTGRES_DB:-claudemaison}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cm-qdrant
    restart: unless-stopped
    # `apps` aussi : ai-core et retrieval en dépendent.
    profiles: ["ai", "apps", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    container_name: cm-nats
    restart: unless-stopped
    # `apps` aussi : realtime et ai-core publient/consomment des événements.
    profiles: ["ai", "apps", "full"]
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: cm-minio
    restart: unless-stopped
    profiles: ["ai", "full"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Provider OIDC pour l'étape 3 du module auth.
  # Opt-in via `--profile oidc` : Keycloak coûte ~500 Mo RAM et ~20s au boot,
  # inutile pour les développeurs qui ne touchent pas au flux OIDC.
  # Le realm `claudemaison-dev` est importé au premier démarrage avec le client
  # `edge-api` (PKCE S256) et deux users seedés (alice/bob).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cm-keycloak
    restart: unless-stopped
    profiles: ["oidc", "full"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-claudemaison-dev.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 expose /health/ready sur le port management 9000, mais ce
      # port n'est pas activé en start-dev. On vérifie donc l'endpoint OIDC
      # discovery sur 8080 (présent dès que le realm est importé).
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/claudemaison-dev/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'issuer' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Stack d'observabilité opt-in via `--profile obs`.
  # ~600 Mo RAM combinés, ~10s au boot. Inutile pour la majorité des sessions
  # de dev qui n'inspectent pas les métriques/traces ; quand on en a besoin
  # on lance `docker compose --profile obs up -d` et l'edge-api en local
  # exporte vers le Collector via OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: cm-otel-collector
    restart: unless-stopped
    profiles: ["obs", "full"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP gRPC pour les binaires Node/Go.
      - "4317:4317"
      # OTLP HTTP — c'est ce que utilise edge-api côté SDK Node (proto/HTTP).
      - "4318:4318"
      # Endpoint Prometheus exposé par le Collector (scrape par Prom).
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: cm-prometheus
    restart: unless-stopped
    profiles: ["obs", "full"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=72h"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    container_name: cm-tempo
    restart: unless-stopped
    profiles: ["obs", "full"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0" # Tempo a besoin d'écrire dans /var/tempo (volume root par défaut).
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # API HTTP (query, push tempo-cli).
      - "3200:3200"
      # OTLP gRPC interne (ports exposés par le Collector → Tempo, pas par les apps).
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cm-grafana
    restart: unless-stopped
    profiles: ["obs", "full"]
    environment:
      # Dev only : pas d'auth, on ouvre direct. À ne JAMAIS reproduire en prod.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: ""
      # Désactive le phone-home Grafana (souveraineté).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 est pris par edge-api en dev local.
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  # ===========================================================================
  # Applications (profil `apps`).
  # Opt-in : `docker compose --profile apps --profile ai up`. Pour un développeur
  # qui itère sur un seul binaire, faire tourner ce binaire en `pnpm dev` /
  # `uv run` localement et n'utiliser ce profil que pour les démos / smoke E2E.
  # Les images sont buildées à partir des Dockerfiles du repo (pas de pull).
  # ===========================================================================

  edge-api:
    image: claudemaison/edge-api:dev
    # Node binaires : contexte = racine du monorepo (pnpm lockfile + workspace).
    build:
      context: ../..
      dockerfile: apps/edge-api/Dockerfile
    container_name: cm-edge-api
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-claudemaison}:${POSTGRES_PASSWORD:-claudemaison}@postgres:5432/${POSTGRES_DB:-claudemaison}
      REDIS_URL: redis://redis:6379/0
      # JWT — partagés avec realtime (HS256). Les defaults 32+ caractères
      # suffisent au dev local ; surcharger via .env.dev en CI/staging.
      JWT_ISSUER: ${JWT_ISSUER:-claudemaison-edge-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-claudemaison-clients}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-signing-key-32chars-padding}
      # Secret service-à-service (header x-internal-secret) consommé par
      # realtime pour l'ACL conv. MUST matcher la valeur côté realtime.
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-dev-internal-shared-secret-32chars-padding}
      # ai-core HTTP (FastAPI) — POST /v1/chat/turn/stream depuis sendMessage.
      # ai-core écoute sur 4000 (cf. service ai-core HTTP_PORT plus bas).
      AI_CORE_URL: http://ai-core:4000
    ports:
      - "3000:3000"
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    image: claudemaison/realtime:dev
    build:
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    container_name: cm-realtime
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      HTTP_PORT: 3100
      NATS_URL: nats://nats:4222
      # JWT — même clé HS256 que edge-api (signature partagée).
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-signing-key-32chars-padding}
      # Appels internes vers edge-api (/internal/conversations/:id/can-read).
      EDGE_API_INTERNAL_URL: http://edge-api:3000
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-dev-internal-shared-secret-32chars-padding}
    ports:
      - "3100:3100"
    depends_on:
      nats:
        condition: service_started

  ai-core:
    image: claudemaison/ai-core:dev
    build:
      context: ../../apps/ai-core
      dockerfile: Dockerfile
    container_name: cm-ai-core
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      HTTP_PORT: 4000
      GRPC_PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_USER:-claudemaison}:${POSTGRES_PASSWORD:-claudemaison}@postgres:5432/${POSTGRES_DB:-claudemaison}
      NATS_URL: nats://nats:4222
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://inference-router:4200/v1
      # Doit matcher un nom déclaré dans inference-router MODEL_BACKENDS.
      # Le code default `mistral-large-instruct` ne correspond à aucun
      # backend Phase 1 — on force l'alias llama.cpp ici.
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-mistral-7b-instruct-q4}
    ports:
      - "4000:4000"
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      qdrant:
        condition: service_started
      inference-router:
        condition: service_started

  retrieval:
    image: claudemaison/retrieval:dev
    build:
      context: ../../apps/retrieval
      dockerfile: Dockerfile
    container_name: cm-retrieval
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      HTTP_PORT: 4100
      QDRANT_URL: http://qdrant:6333
    ports:
      - "4100:4100"
    depends_on:
      qdrant:
        condition: service_started

  tools:
    image: claudemaison/tools:dev
    build:
      context: ../../apps/tools
      dockerfile: Dockerfile
    container_name: cm-tools
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      GRPC_PORT: 5005
    ports:
      - "5005:5005"

  workers:
    image: claudemaison/workers:dev
    build:
      context: ../../apps/workers
      dockerfile: Dockerfile
    container_name: cm-workers
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379/0
      RETRIEVAL_URL: http://retrieval:4100
    depends_on:
      redis:
        condition: service_healthy
      retrieval:
        condition: service_started

  inference-router:
    image: claudemaison/inference-router:dev
    build:
      context: ../../apps/inference-router
      dockerfile: Dockerfile
    container_name: cm-inference-router
    restart: unless-stopped
    profiles: ["apps", "full"]
    environment:
      NODE_ENV: development
      HTTP_PORT: 4200
      # Routage Phase 1 : llama.cpp local en primary (prio 0), Mistral cloud
      # EU en fallback (prio 1, déclenché seulement si MISTRAL_API_KEY est set
      # via .env.dev). Surchargeable via la var MODEL_BACKENDS du .env.dev.
      MODEL_BACKENDS: ${MODEL_BACKENDS:-mistral-7b-instruct-q4=http://llama-cpp:8080|prio:0,mistral=https://api.mistral.ai|prio:1|env:MISTRAL_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    ports:
      - "4200:4200"

  # Backend LLM local pour le routage Phase 1 (cf. ADR-0006 + ADR-0013).
  # Profil `gpu` opt-in : nécessite un GPU AMD ROCm exposé via /dev/kfd
  # + /dev/dri + groupe video. Sans GPU, l'inference-router bascule sur
  # le fallback Mistral grâce au prio dans MODEL_BACKENDS.
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server-rocm
    container_name: cm-llama-cpp
    restart: unless-stopped
    profiles: ["gpu"]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: ["video"]
    environment:
      LLAMA_ARG_MODEL: /models/mistral-7b-instruct-v0.3.Q4_K_M.gguf
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_N_GPU_LAYERS: "999"
      LLAMA_ARG_CTX_SIZE: "4096"
    volumes:
      - llama-models:/models:ro
    ports:
      # Exposé côté host pour debug (curl /health, /v1/chat/completions
      # directement). À retirer en prod.
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  nats-data:
  minio-data:
  keycloak-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  llama-models:
