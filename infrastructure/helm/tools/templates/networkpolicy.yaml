{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tools.fullname" . }}
  labels: {{- include "tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tools.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Consommé par ai-core uniquement (gRPC).
    - from:
        - podSelector:
            matchLabels:
              claudemaison.io/binary: "true"
      ports:
        - { port: grpc, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # http_get builtin tape Internet par défaut : à restreindre fortement
    # en prod (whitelist d'IPs/domaines via egress + DNS policy).
{{- end }}
