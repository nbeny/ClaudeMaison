{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-core.fullname" . }}
  labels: {{- include "ai-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ai-core.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # edge-api et autres binaires internes.
    - from:
        - podSelector:
            matchLabels:
              claudemaison.io/binary: "true"
      ports:
        - { port: http, protocol: TCP }
        - { port: grpc, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # inference-router + retrieval + OTel Collector : à compléter en
    # values-prod selon les namespaces réels.
{{- end }}
