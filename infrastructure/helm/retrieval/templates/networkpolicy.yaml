{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "retrieval.fullname" . }}
  labels: {{- include "retrieval.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "retrieval.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Consommé en cluster-interne uniquement (ai-core, workers).
    - from:
        - podSelector:
            matchLabels:
              claudemaison.io/binary: "true"
      ports:
        - { port: http, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Qdrant (6333/HTTP, 6334/gRPC) + OTel Collector : préciser les selectors
    # en values-prod.
{{- end }}
