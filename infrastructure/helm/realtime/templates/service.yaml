apiVersion: v1
kind: Service
metadata:
  name: {{ include "realtime.fullname" . }}
  labels: {{- include "realtime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
  selector: {{- include "realtime.selectorLabels" . | nindent 4 }}
