name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les runs en cours sur la même ref (PR push successifs) pour ne pas
# saturer les runners. Le run de `main` n'est jamais annulé (déploiement).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.10.2"

# Pas de job `setup` séparé : `actions/setup-node` + `cache: pnpm` partage le
# store pnpm entre runs via le cache GitHub Actions, keyé par hash du
# lockfile. Les jobs ci-dessous tournent donc en parallèle, chacun fait son
# install (cache hit après le premier succès).

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/*" type-check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/*" test

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    # Docker est préinstallé sur ubuntu-latest, testcontainers détecte le
    # socket /var/run/docker.sock automatiquement — pas de service à monter.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pré-pull les images : évite le pull pendant la fenêtre de wait
      # strategy de testcontainers (qui peut faire timeout sur runner lent).
      - name: Pull container images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: pnpm --filter edge-api test:integration

  python:
    name: Python (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ai-core, retrieval, tools, workers, inference-router]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --frozen || uv sync --extra dev
      # tools doit générer ses stubs gRPC avant lint/typecheck/test.
      - name: Generate gRPC stubs
        if: matrix.app == 'tools'
        run: uv run bash scripts/gen-proto.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, unit, lint, python]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/*" build
